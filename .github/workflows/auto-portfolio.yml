name: Auto-Update Portfolio Repositories

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch and Format Repositories
        run: |
          # 1. Look specifically for your main profile README file
          TARGET_FILE="README.md"
          if [ ! -f "$TARGET_FILE" ]; then
            # If lowercase, capture it
            TARGET_FILE=$(find . -maxdepth 1 -iname "readme.md" | head -n 1 | sed 's|./||')
          fi
          
          echo "Target profile file identified as: $TARGET_FILE"

          # 2. Query GitHub API for your account's public repositories
          echo "Querying GitHub API for iampraveen6..."
          REPOS=$(curl -s "https://api.github.com/users/iampraveen6/repos?sort=pushed&per_page=50")
          
          # Debugging: Print out names of all repositories found by the runner
          echo "--- REPOSITORIES DETECTED BY RUNNER ---"
          echo "$REPOS" | jq -r '.[] | .name'
          echo "---------------------------------------"

          # Initialize the markdown string
          LIST_CONTENT="## 📂 All Repositories & Updates\n\n_Automatically updating when a new project is created_\n\n"
          
          # 3. Parse JSON array
          while read -r repo; do
            if [ -z "$repo" ]; then continue; fi
            
            IS_FORK=$(echo "$repo" | jq -r '.fork')
            
            # Skip fork repos
            if [ "$IS_FORK" = "true" ]; then continue; fi
            
            NAME=$(echo "$repo" | jq -r '.name')
            URL=$(echo "$repo" | jq -r '.html_url')
            DESC=$(echo "$repo" | jq -r '.description')
            LANG=$(echo "$repo" | jq -r '.language')
            STARS=$(echo "$repo" | jq -r '.stargazers_count // 0')
            
            if [ "$DESC" = "null" ] || [ -z "$DESC" ]; then
              DESC="No description provided."
            fi
            
            if [ "$LANG" != "null" ] && [ ! -z "$LANG" ]; then
              LANG_TAG="• \`$LANG\` "
            else
              LANG_TAG=""
            fi
            
            if [ "$STARS" -gt 0 ]; then
              STAR_TAG="⭐ $STARS "
            else
              STAR_TAG=""
            fi
            
            LIST_CONTENT="$LIST_CONTENT* **[$NAME]($URL)**\n  ${LANG_TAG}${STAR_TAG}— $DESC\n\n"
          done < <(echo "$REPOS" | jq -c '.[]')

          # Write to a clean temp file
          printf "$LIST_CONTENT" > new_list.txt
          
          # 4. Swap file contents inside the anchors
          awk '/<!-- REPO_LIST_START -->/{print;system("cat new_list.txt");so=1;next} /<!-- REPO_LIST_END -->/{so=0} !so' "$TARGET_FILE" > temp_README.md && mv temp_README.md "$TARGET_FILE"
          rm new_list.txt
          
          echo "TARGET_FILENAME=$TARGET_FILE" >> $GITHUB_ENV

      - name: Commit and Push Changes Safely
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add "$TARGET_FILENAME"
          
          # Check changes explicitly
          if ! git diff --cached --quiet; then
            echo "Changes detected. Committing to repository..."
            git commit -m "🤖 Auto-updated portfolio: sync latest projects"
            git push origin HEAD
          else
            echo "No profile changes detected. Readme up to date."
          fi
